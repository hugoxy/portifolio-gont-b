# Publica o site estático no GitHub Pages.
# NÃO há build: o que está no repositório é exatamente o que o navegador recebe.
# Se alguém reintroduzir `npm install` / `npm run build` aqui, a mudança está
# errada para este projeto — veja CLAUDE.md.
name: Deploy static content to Pages

on:
  # Executa em pushes para a branch padrão
  push:
    branches: ['main']

  # Permite executar este workflow manualmente pela aba Actions
  workflow_dispatch:

# Permissões do GITHUB_TOKEN para o deploy no GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Apenas um deploy concorrente
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # A raiz do repositório já é o site
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
